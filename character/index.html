<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MakeHuman-JS Character</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#07051a;overflow:hidden;font-family:'Space Mono',monospace;}
    #canvas-wrap{width:100vw;height:100vh;position:relative;}
    canvas{display:block;}
    #controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;}
    .btn{padding:8px 18px;background:rgba(145,122,255,0.15);border:1px solid rgba(145,122,255,0.4);color:#c084fc;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.75rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;}
    .btn:hover{background:rgba(145,122,255,0.3);color:#fff;}
    #info{position:absolute;top:20px;left:50%;transform:translateX(-50%);color:rgba(145,122,255,0.6);font-size:0.65rem;letter-spacing:3px;}
  </style>
</head>
<body>
<div id="canvas-wrap">
  <div id="info">// MakeHuman-JS · THREE.js · koordinates</div>
  <div id="controls">
    <button class="btn" onclick="setPose('idle')">Idle</button>
    <button class="btn" onclick="setPose('sit')">Sit</button>
    <button class="btn" onclick="setPose('stand')">Stand</button>
    <button class="btn" onclick="setPose('clap')">Clap</button>
    <button class="btn" onclick="setPose('pranaam')">Pranaam</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Scene setup ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07051a);
scene.fog = new THREE.FogExp2(0x07051a, 0.04);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 3.2);
camera.lookAt(0, 1.0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.5;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.85;
controls.update();

// ── Lighting ─────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x3020a0, 0.6);
scene.add(ambient);

const rimL = new THREE.DirectionalLight(0x917aff, 1.8);
rimL.position.set(-2, 3, -1);
scene.add(rimL);

const rimR = new THREE.DirectionalLight(0x00e8df, 1.2);
rimR.position.set(2, 2, -1);
scene.add(rimR);

const frontL = new THREE.DirectionalLight(0xffeedd, 2.5);
frontL.position.set(0, 2.5, 3);
frontL.castShadow = true;
frontL.shadow.mapSize.set(1024,1024);
scene.add(frontL);

const pointL = new THREE.PointLight(0xff6b9d, 0.8, 8);
pointL.position.set(1.5, 2, 1);
scene.add(pointL);

// ── Materials ─────────────────────────────────────────────────────────────────
const skinMat = new THREE.MeshStandardMaterial({color:0xc07840,roughness:0.65,metalness:0.0});
const skinDarkMat = new THREE.MeshStandardMaterial({color:0x9a5c30,roughness:0.7,metalness:0.0});
const robeMat = new THREE.MeshStandardMaterial({color:0x7a1020,roughness:0.85,metalness:0.05,side:THREE.DoubleSide});
const robeAccent = new THREE.MeshStandardMaterial({color:0x5a0810,roughness:0.9,metalness:0.0,side:THREE.DoubleSide});
const goldMat = new THREE.MeshStandardMaterial({color:0xd4920a,roughness:0.25,metalness:0.85});
const gemMat = new THREE.MeshStandardMaterial({color:0x9060e0,roughness:0.1,metalness:0.2,emissive:0x4020a0,emissiveIntensity:0.4});
const whiteMat = new THREE.MeshStandardMaterial({color:0xfff5e8,roughness:0.4,metalness:0.0});
const hairMat = new THREE.MeshStandardMaterial({color:0x180a04,roughness:0.9,metalness:0.0});
const eyeWhiteMat = new THREE.MeshStandardMaterial({color:0xfff8f0,roughness:0.3});
const irisMat = new THREE.MeshStandardMaterial({color:0x1a0a04,roughness:0.2,metalness:0.1});
const lipMat = new THREE.MeshStandardMaterial({color:0xb03040,roughness:0.5,metalness:0.0});
const bindMat = new THREE.MeshStandardMaterial({color:0xdd1020,roughness:0.3,emissive:0x880010,emissiveIntensity:0.3});
const odhMat = new THREE.MeshStandardMaterial({color:0xc43010,roughness:0.8,metalness:0.0,side:THREE.DoubleSide,transparent:true,opacity:0.92});

// ── Build Human Figure ────────────────────────────────────────────────────────
const root = new THREE.Group();
scene.add(root);

function addMesh(geo, mat, parent, px=0,py=0,pz=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(px,py,pz);
  m.rotation.set(rx,ry,rz);
  m.scale.set(sx,sy,sz);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent||root).add(m);
  return m;
}

// Torso
const torso = addMesh(new THREE.CapsuleGeometry(0.19,0.45,8,16), robeMat, null, 0,1.12,0);
addMesh(new THREE.CapsuleGeometry(0.195,0.44,8,16), robeAccent, null, 0,1.12,-0.01, 0,0,0, 1,1,1);

// Shoulders
addMesh(new THREE.SphereGeometry(0.12,12,10), robeMat, null, -0.26,1.38,0);
addMesh(new THREE.SphereGeometry(0.12,12,10), robeMat, null,  0.26,1.38,0);

// Chest embroidery strip (gold)
addMesh(new THREE.BoxGeometry(0.34,0.04,0.02), goldMat, null, 0,1.42,0.18);
// Mirror work gems on chest
[-0.08,0,0.08].forEach(x=>{
  addMesh(new THREE.SphereGeometry(0.025,8,8), gemMat, null, x,1.38,0.19);
});

// Kamarbandh (waist belt)
addMesh(new THREE.TorusGeometry(0.205,0.025,8,32), goldMat, null, 0,0.90,0, Math.PI/2,0,0);
[-0.08,0,0.08].forEach(x=>{
  addMesh(new THREE.SphereGeometry(0.022,8,8), gemMat, null, x,0.90,0.21);
});

// Ghagra (skirt) — wide cone
addMesh(new THREE.CylinderGeometry(0.42,0.55,0.90,20), robeMat, null, 0,0.50,0);
addMesh(new THREE.CylinderGeometry(0.43,0.56,0.88,20), robeAccent, null, 0,0.50,-0.02);
// Gold border at hem
addMesh(new THREE.TorusGeometry(0.535,0.02,6,36), goldMat, null, 0,0.06,0, Math.PI/2,0,0);
// Mirror work on ghagra
[[0.3,0.4],[−0.3,0.4],[0.45,0.25],[-0.45,0.25],[0,0.6],[0.2,0.15],[-0.2,0.15]].forEach(([x,y])=>{
  if(isNaN(x)) return;
  addMesh(new THREE.SphereGeometry(0.018,6,6), whiteMat, null, x,y,0.42);
});

// Neck
const neck = addMesh(new THREE.CylinderGeometry(0.07,0.09,0.15,12), skinMat, null, 0,1.60,0);

// HEAD group
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.82, 0);
root.add(headGroup);

// Head
addMesh(new THREE.SphereGeometry(0.18,20,16), skinMat, headGroup, 0,0,0);
// Forehead shadow
addMesh(new THREE.SphereGeometry(0.175,16,12), skinDarkMat, headGroup, 0,0.04,-0.02, 0,0,0, 1,0.6,0.7);

// Eyes
const eyeL = new THREE.Group(); eyeL.position.set(-0.07,0.02,0.15); headGroup.add(eyeL);
addMesh(new THREE.SphereGeometry(0.038,12,10), eyeWhiteMat, eyeL);
addMesh(new THREE.SphereGeometry(0.026,10,8), irisMat, eyeL, 0,0,0.02);
addMesh(new THREE.SphereGeometry(0.012,8,6), whiteMat, eyeL, 0.008,0.008,0.03);
// Eyelid
addMesh(new THREE.SphereGeometry(0.040,12,6), skinMat, eyeL, 0,0.018,0, 0,0,0, 1,0.5,1);

const eyeR = new THREE.Group(); eyeR.position.set(0.07,0.02,0.15); headGroup.add(eyeR);
addMesh(new THREE.SphereGeometry(0.038,12,10), eyeWhiteMat, eyeR);
addMesh(new THREE.SphereGeometry(0.026,10,8), irisMat, eyeR, 0,0,0.02);
addMesh(new THREE.SphereGeometry(0.012,8,6), whiteMat, eyeR, 0.008,0.008,0.03);
addMesh(new THREE.SphereGeometry(0.040,12,6), skinMat, eyeR, 0,0.018,0, 0,0,0, 1,0.5,1);

// Eyebrows
const browGeo = new THREE.CapsuleGeometry(0.005,0.055,4,8);
addMesh(browGeo, hairMat, headGroup, -0.07,0.07,0.165, 0,0,0.18);
addMesh(browGeo, hairMat, headGroup,  0.07,0.07,0.165, 0,0,-0.18);

// Nose
addMesh(new THREE.CapsuleGeometry(0.012,0.04,6,8), skinMat, headGroup, 0,-0.02,0.175, 0.3,0,0);
addMesh(new THREE.SphereGeometry(0.022,8,6), skinMat, headGroup, 0,-0.055,0.17, 0,0,0, 1,0.7,0.8);

// Lips
addMesh(new THREE.CapsuleGeometry(0.01,0.06,4,8), lipMat, headGroup, 0,-0.08,0.168, 0,0,0, 1,1.2,1);
addMesh(new THREE.SphereGeometry(0.018,8,6), lipMat, headGroup, 0,-0.095,0.168, 0,0,0, 1.8,1,0.8);

// Cheeks blush
addMesh(new THREE.SphereGeometry(0.06,8,6), new THREE.MeshStandardMaterial({color:0xd06050,roughness:1,transparent:true,opacity:0.25}), headGroup, -0.11,-0.02,0.12);
addMesh(new THREE.SphereGeometry(0.06,8,6), new THREE.MeshStandardMaterial({color:0xd06050,roughness:1,transparent:true,opacity:0.25}), headGroup,  0.11,-0.02,0.12);

// Ears
addMesh(new THREE.SphereGeometry(0.045,10,8), skinMat, headGroup, -0.19,-0.01,0, 0,0,0, 0.6,1,0.5);
addMesh(new THREE.SphereGeometry(0.045,10,8), skinMat, headGroup,  0.19,-0.01,0, 0,0,0, 0.6,1,0.5);

// Jhumka earrings
[[-0.195,-0.04],[ 0.195,-0.04]].forEach(([x])=>{
  addMesh(new THREE.TorusGeometry(0.022,0.006,6,12), goldMat, headGroup, x,-0.04,0, Math.PI/2,0,0);
  addMesh(new THREE.SphereGeometry(0.018,8,6), goldMat, headGroup, x,-0.075,0);
  addMesh(new THREE.SphereGeometry(0.008,6,6), gemMat, headGroup, x,-0.075,0);
});

// Bindi
addMesh(new THREE.SphereGeometry(0.016,8,8), bindMat, headGroup, 0,0.09,0.175);

// Maang tikka
addMesh(new THREE.CylinderGeometry(0.003,0.003,0.08,6), goldMat, headGroup, 0,0.14,0.1, -0.4,0,0);
addMesh(new THREE.SphereGeometry(0.018,8,6), goldMat, headGroup, 0,0.18,0.08);
addMesh(new THREE.SphereGeometry(0.009,6,6), gemMat, headGroup, 0,0.18,0.09);

// Hair (bun style)
addMesh(new THREE.SphereGeometry(0.185,16,12), hairMat, headGroup, 0,0.05,-0.05, 0,0,0, 1,0.9,0.85);
addMesh(new THREE.SphereGeometry(0.08,10,8), hairMat, headGroup, 0,0.16,-0.12);
// Hair parting
addMesh(new THREE.CapsuleGeometry(0.008,0.15,4,8), new THREE.MeshStandardMaterial({color:0xc07840}), headGroup, 0,0.17,0.08, 0,0,Math.PI/2);

// Odhna (head scarf)
addMesh(new THREE.SphereGeometry(0.20,16,10), odhMat, headGroup, 0,0.04,0, 0,0,0, 1,0.85,1);
addMesh(new THREE.CylinderGeometry(0.12,0.25,0.6,14,1,true), odhMat, null, -0.15,1.55,-0.08, 0,0,0.15);
// Odhna gold border
addMesh(new THREE.TorusGeometry(0.20,0.006,4,20), goldMat, headGroup, 0,0.04,0, Math.PI/2,0,0);

// Nath (nose ring)
addMesh(new THREE.TorusGeometry(0.022,0.005,6,14), goldMat, headGroup, 0.04,-0.055,0.172, 0,0.3,0);
addMesh(new THREE.SphereGeometry(0.010,6,6), goldMat, headGroup, 0.06,-0.055,0.172);

// Hasli necklace
addMesh(new THREE.TorusGeometry(0.12,0.012,8,24), goldMat, null, 0,1.55,0.04, 0.4,0,0);
addMesh(new THREE.SphereGeometry(0.02,8,6), goldMat, null, 0,1.46,0.15);
addMesh(new THREE.SphereGeometry(0.01,6,6), gemMat, null, 0,1.46,0.16);

// ── ARMS ─────────────────────────────────────────────────────────────────────
const armLGroup = new THREE.Group();
armLGroup.position.set(-0.28, 1.38, 0);
root.add(armLGroup);

const upperArmL = addMesh(new THREE.CapsuleGeometry(0.055,0.24,6,10), robeMat, armLGroup, -0.14,-0.14,0, 0,0,0.4);
const foreArmL  = addMesh(new THREE.CapsuleGeometry(0.045,0.20,6,10), skinMat, armLGroup, -0.26,-0.32,0, 0,0,0.5);
const handL     = addMesh(new THREE.SphereGeometry(0.05,10,8), skinMat, armLGroup, -0.35,-0.46,0, 0,0,0, 1.2,0.7,0.8);

const armRGroup = new THREE.Group();
armRGroup.position.set(0.28, 1.38, 0);
root.add(armRGroup);

const upperArmR = addMesh(new THREE.CapsuleGeometry(0.055,0.24,6,10), robeMat, armRGroup, 0.14,-0.14,0, 0,0,-0.4);
const foreArmR  = addMesh(new THREE.CapsuleGeometry(0.045,0.20,6,10), skinMat, armRGroup, 0.26,-0.32,0, 0,0,-0.5);
const handR     = addMesh(new THREE.SphereGeometry(0.05,10,8), skinMat, armRGroup, 0.35,-0.46,0, 0,0,0, 1.2,0.7,0.8);

// Bangles
[0.15,0.12,0.09].forEach((y,i)=>{
  const cols=[0xd4920a,0x9060e0,0xff6090];
  addMesh(new THREE.TorusGeometry(0.048,0.008,6,16), new THREE.MeshStandardMaterial({color:cols[i],roughness:0.3,metalness:0.6}), armLGroup, -0.30,-0.38-y*0.1,0, 0,0,0.5);
  addMesh(new THREE.TorusGeometry(0.048,0.008,6,16), new THREE.MeshStandardMaterial({color:cols[i],roughness:0.3,metalness:0.6}), armRGroup,  0.30,-0.38-y*0.1,0, 0,0,-0.5);
});

// ── Floor / Platform ─────────────────────────────────────────────────────────
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.5,48),
  new THREE.MeshStandardMaterial({color:0x1a1535,roughness:0.9,metalness:0.1})
);
floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;
scene.add(floor);

// Glow ring on floor
const ringGeo = new THREE.TorusGeometry(0.8,0.018,6,64);
const ringMat = new THREE.MeshStandardMaterial({color:0x917aff,emissive:0x5030d0,emissiveIntensity:0.8,roughness:0.2});
const floorRing = new THREE.Mesh(ringGeo, ringMat);
floorRing.rotation.x = -Math.PI/2;
floorRing.position.y = 0.001;
scene.add(floorRing);

// Particle system
const partGeo = new THREE.BufferGeometry();
const partCount = 200;
const pos = new Float32Array(partCount*3);
for(let i=0;i<partCount*3;i++) pos[i]=(Math.random()-0.5)*6;
partGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const parts = new THREE.Points(partGeo, new THREE.PointsMaterial({color:0x917aff,size:0.02,transparent:true,opacity:0.6}));
scene.add(parts);

// ── Pose system ──────────────────────────────────────────────────────────────
let currentPose = 'idle';
let poseTarget = {};
let poseCurrent = {};

const poses = {
  idle: {
    armLRot: 0.4, armRRot:-0.4, armLY:-0.14, armRY:-0.14,
    headPitch: 0, bodyPitch: 0, bodyY: 0
  },
  sit: {
    armLRot: 0.3, armRRot:-0.3, armLY:-0.05, armRY:-0.05,
    headPitch: 0.1, bodyPitch: 0.05, bodyY:-0.2
  },
  stand: {
    armLRot: 0.25, armRRot:-0.55, armLY:-0.14, armRY:-0.25,
    headPitch:-0.05, bodyPitch:0, bodyY: 0.05
  },
  clap: {
    armLRot:-0.9, armRRot: 0.9, armLY:-0.08, armRY:-0.08,
    headPitch: 0, bodyPitch: 0, bodyY: 0
  },
  pranaam: {
    armLRot:-0.6, armRRot: 0.6, armLY:-0.05, armRY:-0.05,
    headPitch: 0.25, bodyPitch: 0.08, bodyY: 0
  }
};

Object.keys(poses.idle).forEach(k=>{ poseCurrent[k]=poses.idle[k]; poseTarget[k]=poses.idle[k]; });

window.setPose = function(name){
  if(!poses[name]) return;
  poseTarget = {...poses[name]};
  currentPose = name;
};

// ── Animate ──────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let clapPhase = 0;

renderer.setAnimationLoop(()=>{
  const t = clock.getElapsedTime();
  const dt = clock.getDelta ? 0.016 : 0.016;

  // Lerp pose
  Object.keys(poseTarget).forEach(k=>{
    poseCurrent[k] += (poseTarget[k]-poseCurrent[k])*0.08;
  });

  // Apply arms
  armLGroup.rotation.z =  poseCurrent.armLRot + Math.sin(t*0.8)*0.02;
  armRGroup.rotation.z =  poseCurrent.armRRot - Math.sin(t*0.8)*0.02;
  armLGroup.position.y = 1.38 + poseCurrent.armLY;
  armRGroup.position.y = 1.38 + poseCurrent.armRY;

  // Clap animation
  if(currentPose==='clap'){
    clapPhase+=0.15;
    const clapAmt = Math.abs(Math.sin(clapPhase))*0.3;
    armLGroup.position.x = -0.28 + clapAmt;
    armRGroup.position.x =  0.28 - clapAmt;
    armLGroup.rotation.z = -0.9 + clapAmt;
    armRGroup.rotation.z =  0.9 - clapAmt;
  } else {
    clapPhase=0;
    armLGroup.position.x = -0.28;
    armRGroup.position.x =  0.28;
  }

  // Head
  headGroup.rotation.x = poseCurrent.headPitch + Math.sin(t*0.5)*0.015;
  headGroup.position.y = 1.82 + poseCurrent.bodyY + Math.sin(t*0.7)*0.012;

  // Body sway
  root.position.y = poseCurrent.bodyY + Math.sin(t*0.7)*0.008;
  root.rotation.x = poseCurrent.bodyPitch;
  root.rotation.y = Math.sin(t*0.3)*0.03;

  // Floor ring pulse
  floorRing.material.emissiveIntensity = 0.5 + Math.sin(t*2)*0.3;

  // Particles drift
  const pa = partGeo.attributes.position.array;
  for(let i=1;i<partCount*3;i+=3) pa[i]+=0.003; 
  for(let i=1;i<partCount*3;i+=3) if(pa[i]>3) pa[i]=-3;
  partGeo.attributes.position.needsUpdate=true;

  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
