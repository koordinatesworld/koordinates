<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MakeHuman-JS Character</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#07051a;overflow:hidden;font-family:monospace;}
    #info{position:fixed;top:18px;left:50%;transform:translateX(-50%);color:rgba(145,122,255,0.55);font-size:0.65rem;letter-spacing:3px;z-index:10;}
    #controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
    .btn{padding:8px 16px;background:rgba(145,122,255,0.12);border:1px solid rgba(145,122,255,0.38);color:#c084fc;border-radius:8px;cursor:pointer;font-family:monospace;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.2s;}
    .btn:hover,.btn.active{background:rgba(145,122,255,0.28);color:#fff;border-color:rgba(145,122,255,0.7);}
    #loading{position:fixed;inset:0;background:#07051a;display:flex;align-items:center;justify-content:center;color:rgba(145,122,255,0.6);font-size:0.8rem;letter-spacing:3px;z-index:100;}
  </style>
</head>
<body>
<div id="loading">// loading three.js ...</div>
<div id="info">// MakeHuman-JS · THREE.js · koordinates · drag to rotate</div>
<div id="controls">
  <button class="btn active" onclick="setPose('idle',this)">Idle</button>
  <button class="btn" onclick="setPose('sit',this)">Sit</button>
  <button class="btn" onclick="setPose('stand',this)">Stand</button>
  <button class="btn" onclick="setPose('clap',this)">Clap</button>
  <button class="btn" onclick="setPose('pranaam',this)">Pranaam</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.addEventListener('load', function(){
  document.getElementById('loading').style.display='none';

  // ── Renderer
  var renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // ── Scene
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x07051a);
  scene.fog = new THREE.Fog(0x07051a, 8, 18);

  // ── Camera
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 50);
  camera.position.set(0, 1.5, 3.5);

  // ── Orbit Controls (manual, no import needed)
  var isDragging=false, prevMouse={x:0,y:0}, spherical={theta:0,phi:Math.PI/2.5, r:3.5};
  renderer.domElement.addEventListener('mousedown',function(e){isDragging=true;prevMouse={x:e.clientX,y:e.clientY};});
  renderer.domElement.addEventListener('mousemove',function(e){
    if(!isDragging) return;
    spherical.theta -= (e.clientX-prevMouse.x)*0.008;
    spherical.phi = Math.max(0.3,Math.min(2.2,spherical.phi-(e.clientY-prevMouse.y)*0.008));
    prevMouse={x:e.clientX,y:e.clientY};
  });
  renderer.domElement.addEventListener('mouseup',function(){isDragging=false;});
  renderer.domElement.addEventListener('wheel',function(e){spherical.r=Math.max(1.8,Math.min(6,spherical.r+e.deltaY*0.004));});
  // Touch
  var lastTouch=null;
  renderer.domElement.addEventListener('touchstart',function(e){lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};});
  renderer.domElement.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(!lastTouch) return;
    spherical.theta -= (e.touches[0].clientX-lastTouch.x)*0.01;
    spherical.phi = Math.max(0.3,Math.min(2.2,spherical.phi-(e.touches[0].clientY-lastTouch.y)*0.01));
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
  },{passive:false});

  // ── Lights
  scene.add(new THREE.AmbientLight(0x302060, 0.7));
  var sun = new THREE.DirectionalLight(0xffeedd, 2.2);
  sun.position.set(1,3,2); sun.castShadow=true; scene.add(sun);
  var rim1 = new THREE.DirectionalLight(0x917aff, 1.6); rim1.position.set(-2,2,-1); scene.add(rim1);
  var rim2 = new THREE.DirectionalLight(0x00e8df, 1.0); rim2.position.set(2,1.5,-1); scene.add(rim2);
  var pt = new THREE.PointLight(0xff6b9d,0.6,6); pt.position.set(1,2,1); scene.add(pt);

  // ── Materials
  var M = function(col,rough,metal,emit,ei){
    var m=new THREE.MeshStandardMaterial({color:col,roughness:rough||0.7,metalness:metal||0});
    if(emit){m.emissive=new THREE.Color(emit);m.emissiveIntensity=ei||0.3;}
    return m;
  };
  var mat = {
    skin:   M(0xc07840,0.65),
    skinD:  M(0x9a5c30,0.7),
    robe:   M(0x7a1020,0.88),
    robeD:  M(0x4a0810,0.9),
    gold:   M(0xd4920a,0.22,0.88),
    gem:    M(0x8050d0,0.1,0.2,0x4020a0,0.5),
    hair:   M(0x180a04,0.9),
    eyeW:   M(0xfff5e8,0.3),
    iris:   M(0x150804,0.2,0.1),
    lip:    M(0xb03040,0.5),
    bindi:  M(0xdd1020,0.3,0,0x880010,0.4),
    odh:    (function(){var m=M(0xc43010,0.8);m.side=THREE.DoubleSide;m.transparent=true;m.opacity=0.88;return m;})(),
    white:  M(0xfff8f0,0.35),
    floor:  M(0x181430,0.95),
    bang0:  M(0xd4920a,0.25,0.8),
    bang1:  M(0x8050d0,0.2,0.5),
    bang2:  M(0xff5080,0.3,0.4)
  };

  // ── Helper: add mesh
  function add(geo,mat,parent,x,y,z,rx,ry,rz,sx,sy,sz){
    var m=new THREE.Mesh(geo,mat);
    m.position.set(x||0,y||0,z||0);
    if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
    if(sx||sy||sz) m.scale.set(sx||1,sy||1,sz||1);
    m.castShadow=true; m.receiveShadow=true;
    (parent||scene).add(m); return m;
  }

  var root = new THREE.Group(); scene.add(root);
  var PI=Math.PI;

  // ── BODY
  // Torso
  add(new THREE.CylinderGeometry(0.16,0.20,0.52,14),mat.robe,root, 0,1.12,0);
  add(new THREE.SphereGeometry(0.175,12,10),mat.robe,root, 0,1.38,0, 0,0,0, 1,0.75,1);
  // Chest band
  add(new THREE.TorusGeometry(0.17,0.015,6,24),mat.gold,root, 0,1.42,0, PI/2,0,0);
  // Gems on chest
  [-0.08,0,0.08].forEach(function(x){ add(new THREE.SphereGeometry(0.020,8,6),mat.gem,root, x,1.38,0.17); });

  // Ghagra
  add(new THREE.CylinderGeometry(0.40,0.58,0.92,20),mat.robe,root, 0,0.50,0);
  add(new THREE.TorusGeometry(0.555,0.022,6,32),mat.gold,root, 0,0.05,0, PI/2,0,0);
  // Mirror dots
  [[0.28,0.42],[-.28,0.42],[0.44,0.25],[-.44,0.25],[0,0.60],[0.18,0.16],[-.18,0.16]].forEach(function(p){
    add(new THREE.SphereGeometry(0.018,6,6),mat.white,root, p[0],p[1],0.43);
  });

  // Kamarbandh
  add(new THREE.TorusGeometry(0.205,0.024,8,28),mat.gold,root, 0,0.90,0, PI/2,0,0);
  [-0.07,0,0.07].forEach(function(x){ add(new THREE.SphereGeometry(0.020,8,6),mat.gem,root, x,0.90,0.21); });

  // Neck
  add(new THREE.CylinderGeometry(0.065,0.085,0.14,10),mat.skin,root, 0,1.60,0);

  // Necklace
  add(new THREE.TorusGeometry(0.115,0.011,8,22),mat.gold,root, 0,1.55,0.03, 0.4,0,0);
  add(new THREE.SphereGeometry(0.018,8,6),mat.gold,root, 0,1.46,0.15);
  add(new THREE.SphereGeometry(0.009,6,6),mat.gem,root, 0,1.46,0.16);

  // ── HEAD
  var head = new THREE.Group();
  head.position.set(0,1.82,0);
  root.add(head);

  // Head shape
  add(new THREE.SphereGeometry(0.175,18,14),mat.skin,head);
  // Forehead
  add(new THREE.SphereGeometry(0.17,12,8),mat.skinD,head, 0,0.05,-0.02, 0,0,0, 1,0.55,0.65);
  // Cheeks
  add(new THREE.SphereGeometry(0.055,8,6),M(0xd06050,1,0,null,0), head, -0.105,-0.015,0.125, 0,0,0, 1,0.7,0.5);
  add(new THREE.SphereGeometry(0.055,8,6),M(0xd06050,1,0,null,0), head,  0.105,-0.015,0.125, 0,0,0, 1,0.7,0.5);

  // Eyes
  [[-0.068,0.022,0.155],[0.068,0.022,0.155]].forEach(function(p,i){
    var eg=new THREE.Group(); eg.position.set(p[0],p[1],p[2]); head.add(eg);
    add(new THREE.SphereGeometry(0.036,10,8),mat.eyeW,eg);
    add(new THREE.SphereGeometry(0.025,8,8),mat.iris,eg, (i===0?0.005:-0.005),0,0.018);
    add(new THREE.SphereGeometry(0.011,6,6),mat.white,eg, (i===0?0.008:-0.008),0.007,0.028);
    // Eyelid
    add(new THREE.SphereGeometry(0.038,10,5),mat.skin,eg, 0,0.016,0, 0,0,0, 1,0.45,1);
  });

  // Eyebrows
  add(new THREE.CapsuleGeometry(0.005,0.052,4,8),mat.hair,head, -0.068,0.072,0.162, 0,0,0.18);
  add(new THREE.CapsuleGeometry(0.005,0.052,4,8),mat.hair,head,  0.068,0.072,0.162, 0,0,-0.18);

  // Nose
  add(new THREE.CapsuleGeometry(0.011,0.038,5,8),mat.skin,head, 0,-0.018,0.172, 0.3,0,0);
  add(new THREE.SphereGeometry(0.020,8,6),mat.skin,head, 0,-0.052,0.168, 0,0,0, 1,0.65,0.75);

  // Lips
  add(new THREE.CapsuleGeometry(0.009,0.055,4,8),mat.lip,head, 0,-0.078,0.166, 0,0,0, 1,1.2,1);
  add(new THREE.SphereGeometry(0.016,8,6),mat.lip,head, 0,-0.093,0.166, 0,0,0, 1.7,0.9,0.75);

  // Bindi
  add(new THREE.SphereGeometry(0.015,8,8),mat.bindi,head, 0,0.088,0.172);

  // Maang tikka
  add(new THREE.CylinderGeometry(0.003,0.003,0.075,6),mat.gold,head, 0,0.138,0.1, -0.38,0,0);
  add(new THREE.SphereGeometry(0.017,8,6),mat.gold,head, 0,0.175,0.082);
  add(new THREE.SphereGeometry(0.009,6,6),mat.gem,head, 0,0.175,0.092);

  // Nath
  add(new THREE.TorusGeometry(0.020,0.005,5,12),mat.gold,head, 0.038,-0.052,0.168, 0,0.28,0);
  add(new THREE.SphereGeometry(0.009,6,6),mat.gold,head, 0.056,-0.052,0.168);

  // Ears + jhumka
  [[-0.185,-0.01],[0.185,-0.01]].forEach(function(p){
    add(new THREE.SphereGeometry(0.042,8,6),mat.skin,head, p[0],p[1],0, 0,0,0, 0.55,1,0.45);
    add(new THREE.TorusGeometry(0.020,0.006,5,10),mat.gold,head, p[0],p[1]-0.03,0, PI/2,0,0);
    add(new THREE.SphereGeometry(0.016,6,6),mat.gold,head, p[0],p[1]-0.065,0);
    add(new THREE.SphereGeometry(0.007,5,5),mat.gem,head, p[0],p[1]-0.065,0);
  });

  // Hair
  add(new THREE.SphereGeometry(0.180,14,10),mat.hair,head, 0,0.05,-0.04, 0,0,0, 1,0.88,0.82);
  add(new THREE.SphereGeometry(0.075,8,8),mat.hair,head, 0,0.155,-0.115);

  // Odhna on head
  add(new THREE.SphereGeometry(0.195,14,8),mat.odh,head, 0,0.04,0, 0,0,0, 1,0.82,1);
  add(new THREE.TorusGeometry(0.195,0.006,4,18),mat.gold,head, 0,0.04,0, PI/2,0,0);
  // Odhna side drape
  add(new THREE.CylinderGeometry(0.10,0.22,0.55,12,1,true),mat.odh,root, -0.14,1.55,-0.06, 0,0,0.12);

  // ── ARMS
  var armL = new THREE.Group(); armL.position.set(-0.26,1.38,0); root.add(armL);
  var armR = new THREE.Group(); armR.position.set( 0.26,1.38,0); root.add(armR);

  add(new THREE.CapsuleGeometry(0.052,0.22,5,8),mat.robe,armL, -0.13,-0.13,0, 0,0,0.38);
  add(new THREE.CapsuleGeometry(0.042,0.18,5,8),mat.skin,armL, -0.25,-0.29,0, 0,0,0.48);
  add(new THREE.SphereGeometry(0.048,8,6),mat.skin,armL, -0.34,-0.43,0, 0,0,0, 1.15,0.65,0.75);

  add(new THREE.CapsuleGeometry(0.052,0.22,5,8),mat.robe,armR,  0.13,-0.13,0, 0,0,-0.38);
  add(new THREE.CapsuleGeometry(0.042,0.18,5,8),mat.skin,armR,  0.25,-0.29,0, 0,0,-0.48);
  add(new THREE.SphereGeometry(0.048,8,6),mat.skin,armR,  0.34,-0.43,0, 0,0,0, 1.15,0.65,0.75);

  // Bangles
  [0.13,0.10,0.07].forEach(function(y,i){
    var bm=[mat.bang0,mat.bang1,mat.bang2][i];
    add(new THREE.TorusGeometry(0.046,0.008,5,14),bm,armL, -0.28,-0.36-y*0.08,0, 0,0,0.48);
    add(new THREE.TorusGeometry(0.046,0.008,5,14),bm,armR,  0.28,-0.36-y*0.08,0, 0,0,-0.48);
  });

  // ── FLOOR
  var floorMesh = new THREE.Mesh(new THREE.CircleGeometry(3,40), mat.floor);
  floorMesh.rotation.x=-PI/2; floorMesh.receiveShadow=true; scene.add(floorMesh);
  var ringM = new THREE.MeshStandardMaterial({color:0x917aff,emissive:new THREE.Color(0x5030d0),emissiveIntensity:0.7,roughness:0.2});
  var floorRing = new THREE.Mesh(new THREE.TorusGeometry(0.75,0.016,5,56), ringM);
  floorRing.rotation.x=-PI/2; floorRing.position.y=0.001; scene.add(floorRing);

  // Particles
  var pGeo=new THREE.BufferGeometry();
  var pPos=new Float32Array(300*3);
  for(var i=0;i<300*3;i++) pPos[i]=(Math.random()-0.5)*7;
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
  scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x917aff,size:0.018,transparent:true,opacity:0.55})));

  // ── Pose system
  var poses={
    idle:    {lz:0.38, rz:-0.38, lx:-0.26, rx:0.26, ly:1.24, ry:1.24, hpitch:0,  bpitch:0,   by:0},
    sit:     {lz:0.25, rz:-0.25, lx:-0.24, rx:0.24, ly:1.33, ry:1.33, hpitch:0.1,bpitch:0.06,by:-0.18},
    stand:   {lz:0.22, rz:-0.52, lx:-0.26, rx:0.26, ly:1.40, ry:1.32, hpitch:-0.04,bpitch:0,  by:0.04},
    clap:    {lz:-0.85,rz:0.85,  lx:-0.10, rx:0.10, ly:1.38, ry:1.38, hpitch:0,  bpitch:0,   by:0},
    pranaam: {lz:-0.55,rz:0.55,  lx:-0.12, rx:0.12, ly:1.38, ry:1.38, hpitch:0.22,bpitch:0.08,by:0}
  };
  var cur={}; var tgt={}; Object.keys(poses.idle).forEach(function(k){cur[k]=poses.idle[k];tgt[k]=poses.idle[k];});
  var currentPose='idle', clapT=0;

  window.setPose=function(name,btn){
    if(!poses[name]) return;
    tgt=Object.assign({},poses[name]);
    currentPose=name;
    document.querySelectorAll('.btn').forEach(function(b){b.classList.remove('active');});
    if(btn) btn.classList.add('active');
  };

  // ── Animation loop
  var clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    var t=clock.getElapsedTime();

    // Lerp pose
    Object.keys(tgt).forEach(function(k){cur[k]+=(tgt[k]-cur[k])*0.09;});

    armL.rotation.z=cur.lz+Math.sin(t*0.75)*0.018;
    armR.rotation.z=cur.rz-Math.sin(t*0.75)*0.018;

    // Clap bounce
    if(currentPose==='clap'){
      clapT+=0.18;
      var ca=Math.abs(Math.sin(clapT))*0.25;
      armL.position.set(-0.26+ca, cur.ly, 0);
      armR.position.set( 0.26-ca, cur.ry, 0);
      armL.rotation.z=-0.85+ca;
      armR.rotation.z= 0.85-ca;
    } else {
      clapT=0;
      armL.position.set(cur.lx, cur.ly, 0);
      armR.position.set(cur.rx, cur.ry, 0);
    }

    head.position.y=1.82+cur.by+Math.sin(t*0.65)*0.01;
    head.rotation.x=cur.hpitch+Math.sin(t*0.5)*0.012;
    root.rotation.x=cur.bpitch;
    root.position.y=cur.by+Math.sin(t*0.65)*0.007;
    root.rotation.y=Math.sin(t*0.28)*0.025;

    floorRing.material.emissiveIntensity=0.45+Math.sin(t*2)*0.28;

    // Camera orbit
    var cx=spherical.r*Math.sin(spherical.phi)*Math.sin(spherical.theta);
    var cy=spherical.r*Math.cos(spherical.phi)+1.0;
    var cz=spherical.r*Math.sin(spherical.phi)*Math.cos(spherical.theta);
    camera.position.set(cx,cy,cz);
    camera.lookAt(0,1.1,0);

    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
});
</script>
</body>
</html>
