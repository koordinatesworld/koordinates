<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Human Model · koordinates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0812;font-family:'Segoe UI',sans-serif}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#c084fc;font-size:.9rem;letter-spacing:2px;text-align:center;z-index:5;white-space:pre-wrap;line-height:1.8}
#hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:rgba(255,200,120,.45);font-size:.58rem;letter-spacing:4px;z-index:10;white-space:nowrap;text-transform:uppercase}
#ctrl{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center}
.btn{padding:9px 18px;background:rgba(20,10,40,.7);border:1px solid rgba(200,150,80,.4);color:#e0b87a;border-radius:6px;cursor:pointer;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;transition:all .2s;backdrop-filter:blur(6px)}
.btn.on,.btn:hover{background:rgba(200,150,80,.18);border-color:#e0b87a;color:#fff}
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<div id="status">initialising…</div>
<div id="hud">rajasthani woman · three.js · drag to rotate · scroll to zoom</div>
<div id="ctrl">
  <button class="btn on" onclick="setPose('idle',this)">Stand</button>
  <button class="btn"    onclick="setPose('clap',this)">Clap</button>
  <button class="btn"    onclick="setPose('dance',this)">Dance</button>
  <button class="btn"    onclick="setPose('pranaam',this)">Namaste</button>
  <button class="btn"    onclick="setPose('sit',this)">Sit</button>
</div>

<script>
/* ── multi-CDN loader ── */
var CDNS=[
  'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js',
  'https://unpkg.com/three@0.150.1/build/three.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.150.1/three.min.js'
];
var $s=document.getElementById('status');
function st(t){if($s)$s.textContent=t}
function loadCDN(i){
  if(typeof THREE!=='undefined'){init();return}
  if(i>=CDNS.length){st('CDN failed — check internet');return}
  st('loading engine… ('+( i+1)+'/'+CDNS.length+')')
  var s=document.createElement('script');s.src=CDNS[i];
  s.onload=function(){typeof THREE!=='undefined'?init():loadCDN(i+1)};
  s.onerror=function(){loadCDN(i+1)};
  document.head.appendChild(s);
}

function init(){
  try{build()}catch(e){st('error: '+(e.message||e))}
}

/* ════════════════════════════════════════════════
   REALISTIC RAJASTHANI WOMAN
   Goal: PUBG/game-quality feel —
   • MeshPhysicalMaterial skin (SSS approximation)
   • Anatomical proportions (7.5-head rule)
   • Smooth bone-like arm chain
   • Lehenga with fabric folds
   • Detailed face sculpt
════════════════════════════════════════════════ */
function build(){
  if($s){$s.style.display='none'}
  var PI=Math.PI, W=window.innerWidth, H=window.innerHeight;

  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(W,H);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
  renderer.outputEncoding=THREE.sRGBEncoding||3001;
  document.body.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0812);
  scene.fog=new THREE.FogExp2(0x0a0812,0.055);

  var camera=new THREE.PerspectiveCamera(42,W/H,.05,60);
  camera.position.set(0,1.58,2.8);

  /* ── Lighting (game-style 3-point + rim + fill) ── */
  scene.add(new THREE.AmbientLight(0x3a2850,1.4));
  var key=new THREE.DirectionalLight(0xfff0d8,3.2);
  key.position.set(1.6,3.2,2.4);key.castShadow=true;
  key.shadow.mapSize.set(1024,1024);key.shadow.bias=-.001;scene.add(key);
  var fill=new THREE.DirectionalLight(0x8060ff,1.2);fill.position.set(-2,1.5,-1);scene.add(fill);
  var rim=new THREE.DirectionalLight(0x00e8df,.9);rim.position.set(.5,2,-2.5);scene.add(rim);
  var hair_light=new THREE.PointLight(0xff8040,.8,4);hair_light.position.set(0,2.5,.5);scene.add(hair_light);

  /* ── Materials ── */
  function skin(c,r){
    return new THREE.MeshPhysicalMaterial({
      color:c||0xc48050,roughness:r!=null?r:.65,metalness:0,
      sheen:.35,sheenColor:new THREE.Color(0xff9060),
      clearcoat:.08,clearcoatRoughness:.6
    });
  }
  var SK=skin(0xc47848,.62);
  var SKD=skin(0xa85e35,.7);   // darker (ears, ankles)
  var LIP=new THREE.MeshPhysicalMaterial({color:0xb83050,roughness:.4,metalness:0,clearcoat:.4});
  var EYE_W=new THREE.MeshPhysicalMaterial({color:0xf5ede0,roughness:.2,clearcoat:.8});
  var IRIS=new THREE.MeshPhysicalMaterial({color:0x1a0c08,roughness:.1,metalness:.05});
  var HAIR=new THREE.MeshPhysicalMaterial({color:0x0e0804,roughness:.75,metalness:.05});
  var HAIR2=new THREE.MeshStandardMaterial({color:0x1a0e09,roughness:.8});

  /* lehenga (deep magenta/maroon) */
  var LEH=new THREE.MeshPhysicalMaterial({color:0x8a0a2a,roughness:.75,metalness:.02,side:THREE.DoubleSide});
  var LEH2=new THREE.MeshPhysicalMaterial({color:0xa0102e,roughness:.7,metalness:.02});
  var CHOLI=new THREE.MeshPhysicalMaterial({color:0x6a0822,roughness:.7,metalness:.02});
  /* gold */
  var GOLD=new THREE.MeshPhysicalMaterial({color:0xd4920a,roughness:.18,metalness:.92,clearcoat:.5});
  var GOLD2=new THREE.MeshPhysicalMaterial({color:0xe8aa20,roughness:.12,metalness:.95});
  var GEM=new THREE.MeshPhysicalMaterial({color:0x5830aa,roughness:.05,metalness:.2,transparent:true,opacity:.9,clearcoat:1});
  var BINDI=new THREE.MeshPhysicalMaterial({color:0xdd1020,roughness:.2,metalness:.1,emissive:new THREE.Color(0x880010),emissiveIntensity:.4});
  var FL=new THREE.MeshStandardMaterial({color:0x100820,roughness:.95});
  var SHADOW=new THREE.MeshStandardMaterial({color:0x180828,roughness:1,transparent:true,opacity:.4});

  /* helper: add mesh to parent */
  function mk(geo,mat,par,x,y,z,rx,ry,rz,sx,sy,sz){
    var m=new THREE.Mesh(geo,mat);
    m.position.set(x||0,y||0,z||0);
    if(rx||ry||rz)m.rotation.set(rx||0,ry||0,rz||0);
    if(sx!=null)m.scale.set(sx,sy!=null?sy:sx,sz!=null?sz:sx);
    m.castShadow=true;m.receiveShadow=true;
    (par||scene).add(m);return m;
  }
  function cyl(rt,rb,h,s){return new THREE.CylinderGeometry(rt,rb,h,s||20)}
  function sph(r,w,h){return new THREE.SphereGeometry(r,w||20,h||16)}
  function box(w,h,d){return new THREE.BoxGeometry(w,h,d)}

  /* ── ROOT group (whole body shifts for poses) ── */
  var body=new THREE.Group();scene.add(body);

  /* ════ FEET & LEGS ════ */
  [-1,1].forEach(function(s){
    var foot=mk(cyl(.036,.04,.2,14),SK,body,s*.072,.1,.04,PI/2,0,0);
    mk(sph(.04,12,10),SK,body,s*.072,.2,.06);          // ankle
    mk(new THREE.TorusGeometry(.04,.005,8,24),GOLD,body,s*.072,.2,.06,PI/2,0,0); // payal
    mk(sph(.018,8,8),GOLD,body,s*.072,.195,.098);      // payal bead
    mk(cyl(.048,.055,.52,16),SK,body,s*.078,.52,.0);   // shin
    mk(sph(.054,14,12),SK,body,s*.078,.78,0);          // knee
    mk(cyl(.052,.048,.48,16),SK,body,s*.074,1.02,0);   // thigh
  });

  /* ════ PELVIS / HIPS ════ */
  mk(sph(.135,18,14),SK,body,0,.95,0,0,0,0,1.35,.8,1.08);

  /* ════ LEHENGA (layered skirt — realistic flare) ════ */
  // inner layer
  mk(cyl(.17,.44,1.08,32),LEH,body,0,.42,0);
  // outer flare (wider, slightly transparent)
  var outLeh=mk(cyl(.22,.52,1.06,40),new THREE.MeshPhysicalMaterial({color:0x9a0f2f,roughness:.68,metalness:.01,side:THREE.DoubleSide,transparent:true,opacity:.92}),body,0,.42,0);
  // hem gold border
  mk(new THREE.TorusGeometry(.508,.014,8,60),GOLD,body,0,-.12,0,PI/2,0,0);
  // pleats / gota patti (gold stripes around hem)
  for(var p=0;p<20;p++){
    var pa=p/20*PI*2;
    mk(new THREE.PlaneGeometry(.04,.08),GOLD,body,Math.sin(pa)*.5,-.06,Math.cos(pa)*.5,0,-pa,0);
  }
  // waist band
  mk(new THREE.TorusGeometry(.175,.014,8,40),GOLD,body,0,.96,0,PI/2,0,0);
  // kamarbandh (waist chain)
  mk(new THREE.TorusGeometry(.172,.006,6,40),GOLD2,body,0,.93,0,PI/2,0,0);
  for(var k=0;k<8;k++){
    var ka=k/8*PI*2;
    mk(sph(.01,6,6),GEM,body,Math.sin(ka)*.172,.93,Math.cos(ka)*.172);
  }

  /* ════ TORSO / CHOLI ════ */
  mk(cyl(.115,.13,.42,20),CHOLI,body,0,1.18,0);        // waist→ribs
  mk(sph(.14,20,16),CHOLI,body,0,1.4,0,0,0,0,1.08,.78,1); // chest
  // bust (subtle, feminine — not protruding)
  [-1,1].forEach(function(s){
    mk(sph(.052,14,12),CHOLI,body,s*.05,1.345,.04,0,0,0,1,.82,.62);
  });
  // choli back
  mk(cyl(.115,.12,.38,20),CHOLI,body,0,1.17,.01);
  // odhni / dupatta draped over left shoulder + down the back
  mk(cyl(.14,.17,.5,16,1,true),new THREE.MeshPhysicalMaterial({color:0xffc233,roughness:.8,metalness:.03,side:THREE.DoubleSide,transparent:true,opacity:.7}),body,-.02,1.25,-.08,.1,0,.05);
  mk(new THREE.TorusGeometry(.04,.012,8,24),GOLD,body,-.16,1.46,.02,.4,.3,.2); // shoulder pin

  /* ════ NECK ════ */
  mk(cyl(.048,.056,.12,16),SK,body,0,1.56,0);
  // neck chain (mangalsutra hint)
  mk(new THREE.TorusGeometry(.052,.004,6,20),GOLD,body,0,1.58,0,PI/2,0,0);

  /* ════ HEAD (detailed face sculpt) ════ */
  var head=new THREE.Group();head.position.set(0,1.72,0);body.add(head);

  // skull base
  mk(sph(.122,28,24),SK,head,0,.01,0,0,0,0,.95,1.08,.98);
  // jaw / lower face
  mk(sph(.09,20,16),SK,head,0,-.07,.01,0,0,0,.9,.8,.85);
  // cheekbones (subtle puff)
  [-1,1].forEach(function(s){
    mk(sph(.055,14,12),SK,head,s*.072,-.01,.04,0,0,0,1,.65,.85);
  });
  // forehead shape
  mk(sph(.1,20,16),SK,head,0,.06,-.01,0,0,0,.88,.75,.78);
  // chin (soft, feminine)
  mk(sph(.032,12,10),SK,head,0,-.13,.04,0,0,0,.9,.7,.8);

  // ── EYES (almond-shaped) ──
  [-1,1].forEach(function(s){
    var ex=s*.044;
    // eye socket indent
    mk(sph(.032,12,10),skin(0xb86a40,.7),head,ex,.016,.092,0,0,0,1,.7,.7);
    // eyeball
    mk(sph(.028,16,14),EYE_W,head,ex,.016,.105,0,0,0,1,.65,.55);
    // iris
    mk(sph(.016,12,10),IRIS,head,ex,.016,.126);
    // pupil
    mk(sph(.009,10,8),new THREE.MeshStandardMaterial({color:0x000000}),head,ex,.016,.133);
    // eye glint
    mk(sph(.005,8,8),new THREE.MeshPhysicalMaterial({color:0xffffff,clearcoat:1,roughness:.1}),head,ex+.006,.022,.134);
    // upper eyelid (slight fold)
    mk(new THREE.TorusGeometry(.026,.006,6,20),new THREE.MeshPhysicalMaterial({color:0x8a3030,roughness:.5}),head,ex,.024,.112,-.3,0,0,.9,1,1);
    // kajal / eyeliner
    mk(sph(.005,8,6),new THREE.MeshStandardMaterial({color:0x050205}),head,ex+s*.01,.01,.11,0,0,0,3,.5,1);
    // eyebrow (thick, arched Indian style)
    for(var b=0;b<5;b++){
      var ba=((b-2)/2)*.35;
      mk(sph(.006,8,6),HAIR,head,ex+ba*s,.065+Math.abs(ba)*.02,.098+ba*ba*.01);
    }
  });

  // ── NOSE (sharp bridge, wide at base) ──
  mk(cyl(.008,.014,.045,10),SK,head,0,-.008,.115,.3,0,0); // bridge
  mk(sph(.018,12,10),SK,head,0,-.044,.118,0,0,0,.9,.8,.85); // tip
  [-1,1].forEach(function(s){
    mk(sph(.014,10,8),SK,head,s*.016,-.05,.114,0,0,0,1,.75,.8); // nostrils
  });
  // nose ring (nath)
  mk(new THREE.TorusGeometry(.022,.0038,8,20),GOLD,head,-.03,-.05,.108,-.1,.5,.1);
  mk(sph(.009,8,8),GEM,head,-.048,-.055,.108); // nath gem

  // ── LIPS (fuller, defined cupid's bow) ──
  mk(sph(.028,14,12),LIP,head,0,-.082,.116,0,0,0,1.4,.45,.8); // upper lip
  mk(sph(.024,14,12),LIP,head,0,-.096,.116,0,0,0,1.4,.55,.85); // lower lip
  mk(sph(.01,8,8),LIP,head,0,-.088,.122,0,0,0,3,.2,1); // lip line
  // cupid's bow dips
  [-1,1].forEach(function(s){mk(sph(.01,8,8),LIP,head,s*.012,-.078,.12,0,0,0,1,.6,1)});

  // ── EARS ──
  [-1,1].forEach(function(s){
    mk(sph(.028,12,10),SKD,head,s*.118,-.008,0,0,0,0,.6,1,.7);
    // jhumka earring (dangling)
    mk(new THREE.TorusGeometry(.018,.004,8,20),GOLD,head,s*.118,-.022,0,PI*.4,0,0);
    mk(sph(.024,10,10),GOLD,head,s*.118,-.048,.002,0,0,0,1,1.3,1);
    mk(new THREE.ConeGeometry(.014,.032,8),GOLD,head,s*.118,-.068,0,PI,0,0);
    mk(sph(.009,8,8),GEM,head,s*.118,-.05,.018);
  });

  // ── BLUSH ──
  [-1,1].forEach(function(s){
    mk(sph(.04,12,10),new THREE.MeshPhysicalMaterial({color:0xd06050,roughness:.9,transparent:true,opacity:.22}),head,s*.065,-.015,.1);
  });

  // ── BINDI ──
  mk(new THREE.CircleGeometry(.012,16),BINDI,head,0,.075,.122);
  mk(sph(.006,8,8),new THREE.MeshPhysicalMaterial({color:0xff2030,emissive:new THREE.Color(0xaa0010),emissiveIntensity:.5,roughness:.2}),head,0,.075,.124);

  // ── HAIR (parted, long, braid) ──
  mk(sph(.138,28,22),HAIR,head,0,.025,-.012,0,0,0,.98,1.05,1.02); // main scalp
  mk(sph(.105,20,16),HAIR,head,0,.05,.04,0,0,0,1,.78,.62);  // front hairline
  [-1,1].forEach(function(s){
    mk(sph(.062,16,14),HAIR,head,s*.1,-.01,-.03,0,0,0,.7,1.15,.95); // side hair flowing down
    mk(cyl(.026,.018,.26,12),HAIR,head,s*.1,-.2,-.04,0,0,s*.06); // strands behind ears
  });
  // parting line
  mk(new THREE.PlaneGeometry(.005,.2),new THREE.MeshStandardMaterial({color:0xc0784a}),head,0,.13,.085,-.2,0,0);
  // long braid
  var braid=new THREE.Group();braid.position.set(.02,-.18,-.1);head.add(braid);
  for(var bi=0;bi<7;bi++){
    mk(sph(.045-bi*.003,12,10),HAIR,braid,Math.sin(bi*.4)*.012,-(bi*.11),0);
    if(bi%2===0)mk(new THREE.TorusGeometry(.042-.002*bi,.006,6,16),GOLD,braid,0,-(bi*.11),0,PI/2,0,0);
  }
  mk(new THREE.ConeGeometry(.022,.055,10),new THREE.MeshStandardMaterial({color:0xcc1040,roughness:.5}),braid,0,-.78,0,PI,0,0); // paranda tassel

  // maang tikka
  mk(sph(.012,10,10),GOLD,head,0,.145,.062);
  mk(cyl(.003,.003,.06,8),GOLD,head,0,.114,.085,-.35,0,0);
  mk(sph(.016,10,10),GEM,head,0,.092,.1);

  // ── NECKLACE (layered haar) ──
  for(var ni=0;ni<2;ni++){
    var nr=.095+ni*.025;
    for(var na=0;na<14;na++){
      var a2=((na-6.5)/6.5)*.85;
      var gx=Math.sin(a2)*nr, gy=1.48-ni*.04-Math.abs(a2)*.06, gz=Math.cos(a2)*nr;
      mk(sph(.009+ni*.002,8,8),ni===0?GOLD:GEM,body,gx,gy,gz);
    }
  }
  mk(sph(.02,10,10),GEM,body,0,1.37,.1);  // pendant gem
  mk(sph(.015,8,8),GOLD,body,.016,1.36,.1);mk(sph(.015,8,8),GOLD,body,-.016,1.36,.1);

  /* ════ ARMS — 4-segment bone chain ════
     shoulder cap → upper arm → elbow → forearm → wrist → palm → fingers
  ── each segment is a child of previous = proper joint rotation */
  function makeArm(side){
    // shoulder joint group (pivot at shoulder socket)
    var sh=new THREE.Group();
    sh.position.set(side*.148,1.44,-.008);
    body.add(sh);

    // shoulder cap (plugs torso gap)
    mk(sph(.058,16,14),CHOLI,sh,0,0,0);

    // upper arm — pivot = shoulder
    var ua=new THREE.Group();ua.position.set(0,0,0);sh.add(ua);
    mk(cyl(.044,.04,.26,18),CHOLI,ua,0,-.14,0); // sleeve
    mk(sph(.042,14,12),SK,ua,0,-.28,0);           // elbow sphere

    // forearm — pivot = elbow
    var fa=new THREE.Group();fa.position.set(0,-.28,0);ua.add(fa);
    mk(cyl(.036,.032,.24,16),SK,fa,0,-.13,0);
    mk(sph(.034,14,12),SK,fa,0,-.27,0);            // wrist sphere
    // bangles
    [0,1,2,3,4].forEach(function(b){
      mk(new THREE.TorusGeometry(.037,.007,8,24),(b%2?GEM:GOLD),fa,0,-.23-b*.016,0,PI/2,0,0);
    });

    // hand — pivot = wrist
    var hnd=new THREE.Group();hnd.position.set(0,-.27,0);fa.add(hnd);
    mk(sph(.036,16,14),SK,hnd,0,-.02,0,0,0,0,1,.85,.7); // palm
    mk(new THREE.CircleGeometry(.018,12),new THREE.MeshPhysicalMaterial({color:0x8a2010,roughness:.6,transparent:true,opacity:.5}),hnd,0,-.038,.032,-.4,0,0); // mehndi
    // thumb
    var th=new THREE.Group();th.position.set(side*.024,-.03,.02);hnd.add(th);
    th.rotation.z=side*.7;th.rotation.x=.4;
    mk(cyl(.009,.008,.04,8),SK,th,0,-.02,0);
    mk(sph(.009,8,8),SK,th,0,-.044,0);
    // 4 fingers
    [-1.5,-.5,.5,1.5].forEach(function(fp,fi){
      var fg=new THREE.Group();fg.position.set(fp*.014,-.06,.004);hnd.add(fg);
      fg.rotation.x=.22;
      // proximal phalanx
      mk(cyl(.009,.008,.04,8),SK,fg,0,-.02,0);
      mk(sph(.009,8,8),SK,fg,0,-.044,0);  // mid joint
      // middle phalanx
      var mp=new THREE.Group();mp.position.set(0,-.044,0);fg.add(mp);
      mp.rotation.x=.18;
      mk(cyl(.008,.007,.032,8),SK,mp,0,-.016,0);
      mk(sph(.008,8,8),SK,mp,0,-.034,0);
      // distal (fingertip)
      var dp=new THREE.Group();dp.position.set(0,-.034,0);mp.add(dp);
      dp.rotation.x=.1;
      mk(cyl(.007,.005,.022,8),SK,dp,0,-.011,0);
      mk(sph(.007,8,8),SK,dp,0,-.024,0);
      // nail
      mk(new THREE.PlaneGeometry(.01,.014),new THREE.MeshPhysicalMaterial({color:0xffccbb,clearcoat:.9,roughness:.2}),dp,0,-.024,.007,-.2,0,0);
    });
    return {sh:sh,ua:ua,fa:fa,hnd:hnd};
  }
  var aL=makeArm(-1), aR=makeArm(1);

  /* ════ FLOOR ════ */
  mk(cyl(.85,.9,.02,60),FL,null,0,-.01,0);
  mk(new THREE.TorusGeometry(.88,.015,8,80),new THREE.MeshPhysicalMaterial({color:0xd4920a,roughness:.2,metalness:.9,emissive:new THREE.Color(0x5a3800),emissiveIntensity:.4}),null,0,0,0,PI/2,0,0);
  mk(new THREE.CircleGeometry(.85,60),SHADOW,null,0,.005,0,-PI/2,0,0);

  /* ── Particles ── */
  var pGeo=new THREE.BufferGeometry(),NP=250,pArr=new Float32Array(NP*3);
  for(var i=0;i<NP*3;i+=3){pArr[i]=(Math.random()-.5)*8;pArr[i+1]=Math.random()*5-1;pArr[i+2]=(Math.random()-.5)*8;}
  pGeo.setAttribute('position',new THREE.BufferAttribute(pArr,3));
  var pts=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x917aff,size:.022,transparent:true,opacity:.45}));
  scene.add(pts);

  /* ════ POSE SYSTEM ════
     Each pose: {shZ=shoulder lean, uaX=upper arm forward, faX=elbow bend,
                 by=body offset, bp=body pitch, hp=head pitch}
  */
  // shZ=shoulder tuck-in | uaX=upper arm raise FORWARD | faX=elbow bend up
  // faZ=forearm swing toward centre (so hands meet) | danceOff=sway amount
  var POSES={
    idle:   {shZ:.08, uaX:.05, faX:.32, faZ:.05, danceOff:0, by:0,   bp:0,   hp:0},
    clap:   {shZ:.30, uaX:.55, faX:1.55,faZ:.85, danceOff:0, by:0,   bp:.04, hp:.06},
    dance:  {shZ:.55, uaX:.95, faX:.7,  faZ:.2,  danceOff:1, by:0,   bp:.05, hp:.05},
    pranaam:{shZ:.34, uaX:.5,  faX:1.75,faZ:.95, danceOff:0, by:-.03,bp:.1,  hp:.16},
    sit:    {shZ:.1,  uaX:.3,  faX:.65, faZ:.1,  danceOff:0, by:-.3, bp:.04, hp:.04}
  };
  var pose='idle', tgt=JSON.parse(JSON.stringify(POSES.idle));
  var cur=JSON.parse(JSON.stringify(POSES.idle));
  window.setPose=function(p,el){
    pose=p;tgt=JSON.parse(JSON.stringify(POSES[p]));
    document.querySelectorAll('.btn').forEach(function(b){b.classList.remove('on')});
    if(el)el.classList.add('on');
  };

  /* ── Orbit ── */
  var sph2={r:2.8,th:0,ph:1.25},drag=false,ox,oy;
  var cv=renderer.domElement;
  cv.addEventListener('mousedown',function(e){drag=true;ox=e.clientX;oy=e.clientY});
  window.addEventListener('mouseup',function(){drag=false});
  window.addEventListener('mousemove',function(e){
    if(!drag)return;
    sph2.th-=(e.clientX-ox)*.007;
    sph2.ph=Math.max(.3,Math.min(2.2,sph2.ph-(e.clientY-oy)*.006));
    ox=e.clientX;oy=e.clientY;
  });
  cv.addEventListener('wheel',function(e){sph2.r=Math.max(1.2,Math.min(6,sph2.r+e.deltaY*.002));e.preventDefault()},{passive:false});
  var tp2=null;
  cv.addEventListener('touchstart',function(e){drag=true;ox=e.touches[0].clientX;oy=e.touches[0].clientY;tp2=null});
  cv.addEventListener('touchend',function(){drag=false;tp2=null});
  cv.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      if(tp2)sph2.r=Math.max(1.2,Math.min(6,sph2.r-(d-tp2)*.003));tp2=d;return;
    }
    if(!drag)return;
    sph2.th-=(e.touches[0].clientX-ox)*.007;
    sph2.ph=Math.max(.3,Math.min(2.2,sph2.ph-(e.touches[0].clientY-oy)*.006));
    ox=e.touches[0].clientX;oy=e.touches[0].clientY;e.preventDefault();
  },{passive:false});

  /* ── Realistic clap sound (Web Audio, no files) ── */
  var actx=null, clapArmed=false;
  function getCtx(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
  // unlock audio on first interaction (browsers require gesture)
  window.addEventListener('pointerdown',function(){ var c=getCtx(); if(c&&c.state==='suspended')c.resume(); },{once:false});
  function playClap(){
    var c=getCtx(); if(!c) return;
    var now=c.currentTime;
    // layer 1: sharp noise burst (the slap)
    var len=Math.floor(c.sampleRate*0.13);
    var buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); }
    var src=c.createBufferSource(); src.buffer=buf;
    var bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1700; bp.Q.value=0.8;
    var g=c.createGain(); g.gain.setValueAtTime(0.9,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.13);
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(now);
    // layer 2: low body thud (palm cup)
    var o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(320,now); o.frequency.exponentialRampToValueAtTime(110,now+0.08);
    var g2=c.createGain(); g2.gain.setValueAtTime(0.5,now); g2.gain.exponentialRampToValueAtTime(0.001,now+0.1);
    o.connect(g2); g2.connect(c.destination); o.start(now); o.stop(now+0.12);
  }

  /* ── Animate ── */
  var t=0;
  function animate(){
    requestAnimationFrame(animate);
    t+=.016;
    var k=.08;
    for(var key in cur){if(tgt[key]!=null)cur[key]+=(tgt[key]-cur[key])*k;}

    var danceW=cur.danceOff;
    // clap cycle: forearms swing apart & together; sound on contact
    var clapCyc=Math.sin(t*6.5);              // -1..1
    var clapOpen=pose==='clap'?(clapCyc*.5+.5)*.5:0; // 0..0.5 extra opening
    if(pose==='clap'){
      if(clapCyc>.85 && !clapArmed){ playClap(); clapArmed=true; }
      if(clapCyc<.4) clapArmed=false;
    }

    // SHOULDER — left tucks inward (+z), right mirrored
    aL.sh.rotation.z= cur.shZ+Math.sin(t*1.1)*danceW*.5;
    aR.sh.rotation.z=-(cur.shZ+Math.sin(t*1.1+PI)*danceW*.5);
    // UPPER ARM — NEGATIVE x = raise FORWARD (toward camera)
    aL.ua.rotation.x=-cur.uaX - danceW*Math.max(0,Math.sin(t*1.1))*.4;
    aR.ua.rotation.x=-cur.uaX - danceW*Math.max(0,Math.sin(t*1.1+PI))*.4;
    // ELBOW — bend forearm up/forward
    aL.fa.rotation.x=-cur.faX;
    aR.fa.rotation.x=-cur.faX;
    // FOREARM swing toward centre so palms meet (minus clap opening)
    aL.fa.rotation.z= (cur.faZ-clapOpen);
    aR.fa.rotation.z=-(cur.faZ-clapOpen);
    // wrist natural
    aL.hnd.rotation.z= .1;
    aR.hnd.rotation.z=-.1;

    // dance sway
    body.rotation.z=Math.sin(t*1.1)*danceW*.08;
    body.rotation.y+=.0003+danceW*.006;

    head.position.y=1.72+cur.by+Math.sin(t*.6)*.009;
    head.rotation.x=cur.hp+Math.sin(t*.5)*.008;
    body.position.y=cur.by+Math.sin(t*.55)*.007;

    // particles drift up
    var pa=pGeo.attributes.position.array;
    for(var i=1;i<NP*3;i+=3){pa[i]+=.003;if(pa[i]>4)pa[i]=-1;}
    pGeo.attributes.position.needsUpdate=true;

    // camera orbit
    camera.position.set(
      sph2.r*Math.sin(sph2.ph)*Math.sin(sph2.th),
      sph2.r*Math.cos(sph2.ph)+1.3,
      sph2.r*Math.sin(sph2.ph)*Math.cos(sph2.th)
    );
    camera.lookAt(0,1.2,0);
    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
}

loadCDN(0);
</script>
</body>
