<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Human Model · koordinates</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#07051a;font-family:monospace;}
  #status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#c084fc;font-size:0.9rem;letter-spacing:2px;text-align:center;z-index:5;white-space:pre-wrap;line-height:1.6;}
  #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(145,122,255,0.55);font-size:0.6rem;letter-spacing:3px;z-index:10;white-space:nowrap;}
  #controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center;}
  .btn{padding:8px 15px;background:rgba(145,122,255,0.12);border:1px solid rgba(145,122,255,0.4);color:#c084fc;border-radius:8px;cursor:pointer;font-family:monospace;font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;}
  .btn.on,.btn:active{background:rgba(145,122,255,0.3);color:#fff;}
  canvas{display:block;position:fixed;top:0;left:0;}
</style>
</head>
<body>
<div id="status">loading 3D engine…</div>
<div id="info">// human model · three.js · koordinates · drag to rotate</div>

<script>
(function(){
  // ── Robust loader: try multiple CDNs until THREE is defined ──
  var CDNS=[
    "https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js",
    "https://unpkg.com/three@0.134.0/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"
  ];
  var statusEl=document.getElementById('status');
  function setStatus(t){ if(statusEl) statusEl.textContent=t; }

  function tryLoad(i){
    if(typeof THREE!=='undefined'){ start(); return; }
    if(i>=CDNS.length){ setStatus("3D engine load nahi hua.\nNetwork/CDN block ho sakta hai.\nWiFi badal ke try karo."); return; }
    setStatus("loading 3D engine… ("+(i+1)+"/"+CDNS.length+")");
    var s=document.createElement('script');
    s.src=CDNS[i];
    s.onload=function(){ if(typeof THREE!=='undefined') start(); else tryLoad(i+1); };
    s.onerror=function(){ tryLoad(i+1); };
    document.head.appendChild(s);
  }

  function start(){
    try{ build(); }
    catch(e){ setStatus("render error:\n"+(e&&e.message?e.message:e)); }
  }

  // ── The actual 3D human model ──
  function build(){
    if(statusEl) statusEl.style.display='none';
    var PI=Math.PI;
    var W=window.innerWidth, H=window.innerHeight;

    var renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(W,H);
    document.body.appendChild(renderer.domElement);

    var scene=new THREE.Scene();
    scene.background=new THREE.Color(0x07051a);
    scene.fog=new THREE.Fog(0x07051a,9,18);

    var camera=new THREE.PerspectiveCamera(45,W/H,0.1,50);
    camera.position.set(0,1.5,3.6);

    scene.add(new THREE.AmbientLight(0x40307a,0.9));
    var dl=new THREE.DirectionalLight(0xffe8d0,2.3); dl.position.set(1.5,3,2.5); scene.add(dl);
    var rl=new THREE.DirectionalLight(0x917aff,1.6); rl.position.set(-2,2,-1); scene.add(rl);
    var tl=new THREE.DirectionalLight(0x00e8df,1.0); tl.position.set(2,1.5,-1); scene.add(tl);
    var pl=new THREE.PointLight(0xff6b9d,0.7,8); pl.position.set(1,2,1); scene.add(pl);

    function M(c,r,m,ec,ei){
      var o=new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.7:r,metalness:m||0});
      if(ec){o.emissive=new THREE.Color(ec);o.emissiveIntensity=ei||0.3;}
      return o;
    }
    // capsule helper that works on r134 (no CapsuleGeometry)
    function capsule(r,len,seg){ return new THREE.CylinderGeometry(r,r,len+r*2,seg||10); }

    var SK=M(0xc88a52,0.62), SKD=M(0xa86a3a,0.7),
        RO=M(0x9a1530,0.85), GO=M(0xd4920a,0.25,0.85),
        GEM=M(0x7050cc,0.1,0.2,0x3020a0,0.5),
        HA=M(0x140a06,0.9), EW=M(0xfff5e8,0.3), IR=M(0x140804,0.2),
        LP=M(0xb84050,0.5), BD=M(0xdd1020,0.3,0,0x880010,0.4),
        WH=M(0xfff8f0,0.35), FL=M(0x181430,0.95);

    var root=new THREE.Group(); scene.add(root);
    function mesh(geo,mt,par,x,y,z,rx,ry,rz,sx,sy,sz){
      var o=new THREE.Mesh(geo,mt);
      o.position.set(x||0,y||0,z||0);
      if(rx||ry||rz) o.rotation.set(rx||0,ry||0,rz||0);
      if(sx) o.scale.set(sx,sy||sx,sz||sx);
      (par||root).add(o); return o;
    }

    // ── Torso (choli) ──
    mesh(capsule(0.18,0.42,16),RO,null,0,1.12,0);
    mesh(new THREE.SphereGeometry(0.185,16,12),RO,null,0,1.4,0,0,0,0,1,0.78,1);
    // ── Ghagra (skirt) ──
    mesh(new THREE.CylinderGeometry(0.40,0.60,0.95,24),RO,null,0,0.5,0);
    mesh(new THREE.TorusGeometry(0.575,0.02,8,32),GO,null,0,0.05,0,PI/2,0,0);
    // gold waist
    mesh(new THREE.TorusGeometry(0.2,0.025,8,28),GO,null,0,0.9,0,PI/2,0,0);

    // ── Neck + Head ──
    mesh(new THREE.CylinderGeometry(0.058,0.07,0.1,12),SK,null,0,1.62,0);
    var head=new THREE.Group(); head.position.set(0,1.78,0); root.add(head);
    mesh(new THREE.SphereGeometry(0.135,20,18),SK,head,0,0,0,0,0,0,1,1.12,1.02);
    // eyes
    [-0.05,0.05].forEach(function(x){
      mesh(new THREE.SphereGeometry(0.022,10,8),EW,head,x,0.02,0.118,0,0,0,1,0.7,0.6);
      mesh(new THREE.SphereGeometry(0.011,8,8),IR,head,x,0.02,0.132);
    });
    // brows
    [-0.05,0.05].forEach(function(x){ mesh(capsule(0.005,0.04,6),HA,head,x,0.055,0.12,0,0,x>0?-0.2:0.2); });
    // nose
    mesh(capsule(0.012,0.035,8),SK,head,0,-0.01,0.135,0.3,0,0);
    // lips
    mesh(capsule(0.009,0.05,8),LP,head,0,-0.07,0.125,0,0,0,1,1,1);
    // bindi
    mesh(new THREE.CircleGeometry(0.012,12),BD,head,0,0.075,0.135);
    // hair
    mesh(new THREE.SphereGeometry(0.15,20,16),HA,head,0,0.02,-0.02,0,0,0,1,1.1,1);
    mesh(capsule(0.05,0.5,12),HA,head,0,-0.35,-0.1); // braid
    // earrings
    [-0.13,0.13].forEach(function(x){ mesh(new THREE.SphereGeometry(0.018,8,8),GO,head,x,-0.07,0.02); });

    // ── Necklace ──
    for(var a=0;a<11;a++){
      var ang=(a-5)/5*0.9;
      mesh(new THREE.SphereGeometry(0.015,8,8),GO,null,Math.sin(ang)*0.13,1.55-Math.abs(ang)*0.04,Math.cos(ang)*0.13);
    }

    // ── Arms (groups for posing) ──
    var armL=new THREE.Group(); armL.position.set(-0.17,1.4,0); root.add(armL);
    mesh(capsule(0.05,0.24,10),RO,armL,-0.12,-0.12,0,0,0,0.4);
    mesh(capsule(0.042,0.2,10),SK,armL,-0.24,-0.3,0,0,0,0.5);
    mesh(new THREE.SphereGeometry(0.045,10,8),SK,armL,-0.32,-0.42,0);
    [0,1,2].forEach(function(b){ mesh(new THREE.TorusGeometry(0.046,0.008,6,16),GO,armL,-0.27,-0.34-b*0.02,0,0.6,0,0.5); });

    var armR=new THREE.Group(); armR.position.set(0.17,1.4,0); root.add(armR);
    mesh(capsule(0.05,0.24,10),RO,armR,0.12,-0.12,0,0,0,-0.4);
    mesh(capsule(0.042,0.2,10),SK,armR,0.24,-0.3,0,0,0,-0.5);
    mesh(new THREE.SphereGeometry(0.045,10,8),SK,armR,0.32,-0.42,0);
    [0,1,2].forEach(function(b){ mesh(new THREE.TorusGeometry(0.046,0.008,6,16),GO,armR,0.27,-0.34-b*0.02,0,0.6,0,-0.5); });

    // ── Feet ──
    [-0.12,0.12].forEach(function(x){ mesh(capsule(0.05,0.08,8),SK,null,x,0.04,0.05,PI/2,0,0); });

    // ── Floor ring ──
    var fring=mesh(new THREE.TorusGeometry(0.9,0.02,8,48),M(0x917aff,0.3,0.2,0x4030a0,0.6),null,0,0.01,0,PI/2,0,0);
    mesh(new THREE.CircleGeometry(0.85,40),FL,null,0,0,0,-PI/2,0,0);

    // ── Particles ──
    var pg=new THREE.BufferGeometry(), N=200, pos=new Float32Array(N*3);
    for(var i=0;i<N*3;i+=3){ pos[i]=(Math.random()-0.5)*6; pos[i+1]=Math.random()*4-1; pos[i+2]=(Math.random()-0.5)*6; }
    pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x917aff,size:0.02,transparent:true,opacity:0.5})));

    // ── Poses ──
    var POSES={
      idle:{armLZ:0.4,armRZ:-0.4,armLX:0,armRX:0,by:0,bp:0,hp:0},
      sit:{armLZ:0.2,armRZ:-0.2,armLX:0.3,armRX:0.3,by:-0.35,bp:0.05,hp:0.05},
      stand:{armLZ:0.15,armRZ:-0.15,armLX:0,armRX:0,by:0.02,bp:0,hp:-0.05},
      clap:{armLZ:-0.5,armRZ:0.5,armLX:0.6,armRX:0.6,by:0,bp:0.05,hp:0.1},
      pranaam:{armLZ:-0.7,armRZ:0.7,armLX:0.9,armRX:0.9,by:-0.05,bp:0.18,hp:0.25}
    };
    var pose='idle', tgt=POSES.idle, cur={armLZ:0.4,armRZ:-0.4,armLX:0,armRX:0,by:0,bp:0,hp:0};
    window.setPose=function(p,el){
      pose=p; tgt=POSES[p];
      document.querySelectorAll('.btn').forEach(function(b){b.classList.remove('on');});
      if(el) el.classList.add('on');
    };

    // ── Orbit controls ──
    var sph={r:3.9,th:0,ph:1.3}, drag=false, px,py;
    var dom=renderer.domElement;
    dom.addEventListener('mousedown',function(e){drag=true;px=e.clientX;py=e.clientY;});
    window.addEventListener('mouseup',function(){drag=false;});
    window.addEventListener('mousemove',function(e){
      if(!drag)return; sph.th-=(e.clientX-px)*0.008; sph.ph=Math.max(0.4,Math.min(2.4,sph.ph-(e.clientY-py)*0.006)); px=e.clientX;py=e.clientY;
    });
    dom.addEventListener('wheel',function(e){ sph.r=Math.max(2,Math.min(7,sph.r+e.deltaY*0.002)); e.preventDefault(); },{passive:false});
    dom.addEventListener('touchstart',function(e){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;});
    dom.addEventListener('touchend',function(){drag=false;});
    dom.addEventListener('touchmove',function(e){
      if(!drag)return; sph.th-=(e.touches[0].clientX-px)*0.008; sph.ph=Math.max(0.4,Math.min(2.4,sph.ph-(e.touches[0].clientY-py)*0.006)); px=e.touches[0].clientX;py=e.touches[0].clientY; e.preventDefault();
    },{passive:false});

    // ── Animate ──
    var t=0;
    function animate(){
      requestAnimationFrame(animate);
      t+=0.016;
      var k=0.09;
      for(var key in cur){ cur[key]+=(tgt[key]-cur[key])*k; }

      var clapOff=0;
      if(pose==='clap'){ clapOff=Math.abs(Math.sin(t*6))*0.4; }
      armL.rotation.z=cur.armLZ+clapOff;
      armR.rotation.z=cur.armRZ-clapOff;
      armL.rotation.x=cur.armLX;
      armR.rotation.x=cur.armRX;

      head.position.y=1.78+cur.by+Math.sin(t*0.65)*0.01;
      head.rotation.x=cur.hp;
      root.position.y=cur.by+Math.sin(t*0.6)*0.006;
      root.rotation.y=Math.sin(t*0.28)*0.04;
      fring.material.emissiveIntensity=0.45+Math.sin(t*2)*0.25;

      var pa=pg.attributes.position.array;
      for(var i=1;i<N*3;i+=3){ pa[i]+=0.004; if(pa[i]>3) pa[i]=-1; }
      pg.attributes.position.needsUpdate=true;

      camera.position.set(
        sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
        sph.r*Math.cos(sph.ph)+1.1,
        sph.r*Math.sin(sph.ph)*Math.cos(sph.th)
      );
      camera.lookAt(0,1.1,0);
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener('resize',function(){
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  }

  tryLoad(0);
})();
</script>

<div id="controls">
  <button class="btn on" onclick="setPose('idle',this)">Idle</button>
  <button class="btn" onclick="setPose('sit',this)">Sit</button>
  <button class="btn" onclick="setPose('stand',this)">Stand</button>
  <button class="btn" onclick="setPose('clap',this)">Clap</button>
  <button class="btn" onclick="setPose('pranaam',this)">Pranaam</button>
</div>
</body>
</html>
