<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Human Model · koordinates</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#07051a;font-family:monospace;}
  #status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#c084fc;font-size:0.9rem;letter-spacing:2px;text-align:center;z-index:5;white-space:pre-wrap;line-height:1.6;}
  #info{position:fixed;top:16px;left:50%;transform:translateX(-50%);color:rgba(145,122,255,0.55);font-size:0.6rem;letter-spacing:3px;z-index:10;white-space:nowrap;}
  #controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;flex-wrap:wrap;justify-content:center;}
  .btn{padding:8px 15px;background:rgba(145,122,255,0.12);border:1px solid rgba(145,122,255,0.4);color:#c084fc;border-radius:8px;cursor:pointer;font-family:monospace;font-size:0.7rem;letter-spacing:1px;text-transform:uppercase;}
  .btn.on,.btn:active{background:rgba(145,122,255,0.3);color:#fff;}
  canvas{display:block;position:fixed;top:0;left:0;}
</style>
</head>
<body>
<div id="status">loading 3D engine…</div>
<div id="info">// human model · three.js · koordinates · drag to rotate</div>

<script>
(function(){
  // ── Robust loader: try multiple CDNs until THREE is defined ──
  var CDNS=[
    "https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js",
    "https://unpkg.com/three@0.134.0/build/three.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"
  ];
  var statusEl=document.getElementById('status');
  function setStatus(t){ if(statusEl) statusEl.textContent=t; }

  function tryLoad(i){
    if(typeof THREE!=='undefined'){ start(); return; }
    if(i>=CDNS.length){ setStatus("3D engine load nahi hua.\nNetwork/CDN block ho sakta hai.\nWiFi badal ke try karo."); return; }
    setStatus("loading 3D engine… ("+(i+1)+"/"+CDNS.length+")");
    var s=document.createElement('script');
    s.src=CDNS[i];
    s.onload=function(){ if(typeof THREE!=='undefined') start(); else tryLoad(i+1); };
    s.onerror=function(){ tryLoad(i+1); };
    document.head.appendChild(s);
  }

  function start(){
    try{ build(); }
    catch(e){ setStatus("render error:\n"+(e&&e.message?e.message:e)); }
  }

  // ── The actual 3D human model ──
  function build(){
    if(statusEl) statusEl.style.display='none';
    var PI=Math.PI;
    var W=window.innerWidth, H=window.innerHeight;

    var renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    renderer.setSize(W,H);
    document.body.appendChild(renderer.domElement);

    var scene=new THREE.Scene();
    scene.background=new THREE.Color(0x07051a);
    scene.fog=new THREE.Fog(0x07051a,9,18);

    var camera=new THREE.PerspectiveCamera(45,W/H,0.1,50);
    camera.position.set(0,1.5,3.6);

    scene.add(new THREE.AmbientLight(0x40307a,0.9));
    var dl=new THREE.DirectionalLight(0xffe8d0,2.3); dl.position.set(1.5,3,2.5); scene.add(dl);
    var rl=new THREE.DirectionalLight(0x917aff,1.6); rl.position.set(-2,2,-1); scene.add(rl);
    var tl=new THREE.DirectionalLight(0x00e8df,1.0); tl.position.set(2,1.5,-1); scene.add(tl);
    var pl=new THREE.PointLight(0xff6b9d,0.7,8); pl.position.set(1,2,1); scene.add(pl);

    function M(c,r,m,ec,ei){
      var o=new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.7:r,metalness:m||0});
      if(ec){o.emissive=new THREE.Color(ec);o.emissiveIntensity=ei||0.3;}
      return o;
    }
    // capsule helper that works on r134 (no CapsuleGeometry)
    function capsule(r,len,seg){ return new THREE.CylinderGeometry(r,r,len+r*2,seg||10); }

    var SK=M(0xc88a52,0.62), SKD=M(0xa86a3a,0.7),
        RO=M(0x9a1530,0.85), GO=M(0xd4920a,0.25,0.85),
        GEM=M(0x7050cc,0.1,0.2,0x3020a0,0.5),
        HA=M(0x140a06,0.9), EW=M(0xfff5e8,0.3), IR=M(0x140804,0.2),
        LP=M(0xb84050,0.5), BD=M(0xdd1020,0.3,0,0x880010,0.4),
        WH=M(0xfff8f0,0.35), FL=M(0x181430,0.95);

    var root=new THREE.Group(); scene.add(root);
    function mesh(geo,mt,par,x,y,z,rx,ry,rz,sx,sy,sz){
      var o=new THREE.Mesh(geo,mt);
      o.position.set(x||0,y||0,z||0);
      if(rx||ry||rz) o.rotation.set(rx||0,ry||0,rz||0);
      if(sx) o.scale.set(sx,sy||sx,sz||sx);
      (par||root).add(o); return o;
    }

    // ════ FEMININE HUMAN FIGURE — natural proportions ════
    // hips / pelvis (under ghagra)
    mesh(new THREE.SphereGeometry(0.2,16,12),RO,null,0,0.92,0,0,0,0,1,0.7,0.85);
    // ── Ghagra (flared skirt, graceful) ──
    mesh(new THREE.CylinderGeometry(0.21,0.40,0.86,28),RO,null,0,0.47,0);
    mesh(new THREE.TorusGeometry(0.40,0.02,8,40),GO,null,0,0.05,0,PI/2,0,0);
    // skirt pleats hint (gold dashes near hem)
    for(var pl=0;pl<16;pl++){ var pa2=pl/16*PI*2; mesh(new THREE.BoxGeometry(0.015,0.12,0.01),GO,null,Math.sin(pa2)*0.39,0.13,Math.cos(pa2)*0.39,0,-pa2,0); }
    // gold kamarbandh (waist belt)
    mesh(new THREE.TorusGeometry(0.165,0.022,8,28),GO,null,0,0.9,0,PI/2,0,0);

    // ── Torso / choli — slim waist, soft bust (feminine) ──
    mesh(new THREE.CylinderGeometry(0.155,0.16,0.34,18),RO,null,0,1.11,0);     // waist→ribs
    mesh(new THREE.SphereGeometry(0.165,18,14),RO,null,0,1.3,0,0,0,0,1,0.82,0.9); // bust
    [-0.075,0.075].forEach(function(x){ mesh(new THREE.SphereGeometry(0.072,12,10),RO,null,x,1.28,0.085,0,0,0,1,0.85,0.9); });
    // shoulders (narrow, sloped)
    mesh(new THREE.SphereGeometry(0.075,12,10),SK,null,-0.15,1.42,0);
    mesh(new THREE.SphereGeometry(0.075,12,10),SK,null,0.15,1.42,0);

    // ── Neck + Head ──
    mesh(new THREE.CylinderGeometry(0.05,0.058,0.11,12),SK,null,0,1.5,0);
    var head=new THREE.Group(); head.position.set(0,1.66,0); root.add(head);
    mesh(new THREE.SphereGeometry(0.125,22,20),SK,head,0,0,0,0,0,0,0.92,1.1,0.95); // oval face
    mesh(new THREE.SphereGeometry(0.07,12,10),SK,head,0,-0.085,0.02,0,0,0,0.85,0.9,0.85); // chin/jaw
    // eyes (almond, feminine)
    [-0.045,0.045].forEach(function(x){
      mesh(new THREE.SphereGeometry(0.026,12,10),EW,head,x,0.015,0.1,0,0,0,1,0.55,0.5);
      mesh(new THREE.SphereGeometry(0.013,10,8),IR,head,x,0.015,0.115);
      mesh(new THREE.SphereGeometry(0.005,8,6),M(0xffffff,0.2),head,x+0.004,0.022,0.122); // glint
      // lashes/liner
      mesh(capsule(0.004,0.04,6),HA,head,x,0.032,0.1,0,0,x>0?-0.25:0.25);
    });
    // brows
    [-0.045,0.045].forEach(function(x){ mesh(capsule(0.005,0.045,6),HA,head,x,0.058,0.105,0,0,x>0?-0.18:0.18); });
    // nose (slim)
    mesh(capsule(0.011,0.04,8),SK,head,0,-0.012,0.118,0.32,0,0);
    mesh(new THREE.SphereGeometry(0.014,8,6),SK,head,0,-0.035,0.122);
    // lips (fuller, feminine)
    mesh(capsule(0.011,0.045,8),LP,head,0,-0.072,0.108,0,0,0,1,1,0.7);
    mesh(new THREE.SphereGeometry(0.016,10,8),LP,head,0,-0.078,0.105,0,0,0,1,0.55,0.6);
    // cheeks blush
    [-0.07,0.07].forEach(function(x){ mesh(new THREE.CircleGeometry(0.022,12),M(0xd06a6a,0.6),head,x,-0.02,0.11); });
    // bindi
    mesh(new THREE.CircleGeometry(0.011,12),BD,head,0,0.072,0.118);
    // ── Hair: parted, with long braid ──
    mesh(new THREE.SphereGeometry(0.142,22,18),HA,head,0,0.025,-0.015,0,0,0,1,1.05,1.02);
    mesh(new THREE.BoxGeometry(0.01,0.05,0.04),M(0x1a1008,0.5),head,0,0.1,0.1); // centre parting hint
    // side hair framing face
    [-0.115,0.115].forEach(function(x){ mesh(capsule(0.035,0.18,10),HA,head,x,-0.06,0.04); });
    // long braid down the back
    var braid=new THREE.Group(); braid.position.set(0,-0.08,-0.1); head.add(braid);
    [0,1,2,3].forEach(function(s){ mesh(new THREE.SphereGeometry(0.05-s*0.007,12,10),HA,braid,0,-s*0.13,0); });
    mesh(new THREE.ConeGeometry(0.025,0.1,8),M(0xc41040,0.5),braid,0,-0.5,0); // paranda tassel
    // maang-tikka (forehead jewel)
    mesh(new THREE.SphereGeometry(0.014,8,8),GO,head,0,0.14,0.06);
    mesh(capsule(0.004,0.06,6),GO,head,0,0.105,0.085);
    // earrings (jhumka)
    [-0.118,0.118].forEach(function(x){ mesh(new THREE.SphereGeometry(0.016,8,8),GO,head,x,-0.05,0.01); mesh(new THREE.ConeGeometry(0.022,0.03,8),GO,head,x,-0.078,0.01,PI,0,0); });
    // nose ring (nath)
    mesh(new THREE.TorusGeometry(0.022,0.004,6,16),GO,head,-0.03,-0.04,0.1,0,0.4,0);

    // ── Necklace (haar) layered ──
    for(var a=0;a<13;a++){ var ang=(a-6)/6*0.95; mesh(new THREE.SphereGeometry(0.013,8,8),GO,null,Math.sin(ang)*0.12,1.46-Math.abs(ang)*0.03,Math.cos(ang)*0.1+0.02); }
    mesh(new THREE.SphereGeometry(0.022,10,8),GEM,null,0,1.36,0.14); // pendant

    // ════ ARMS — fully jointed: shoulder→upper→elbow→forearm→wrist→hand ════
    function buildArm(side){
      // shoulder pivot
      var g=new THREE.Group(); g.position.set(0.145*side,1.42,0); root.add(g);
      // deltoid / shoulder cap (fills the gap to torso)
      mesh(new THREE.SphereGeometry(0.058,14,12),RO,g,0,0,0);
      // UPPER ARM (sleeve) — top of capsule sits right at shoulder
      mesh(capsule(0.044,0.18,14),RO,g,0,-0.13,0);
      mesh(new THREE.TorusGeometry(0.046,0.006,6,16),GEM,g,0,-0.22,0,PI/2,0,0); // bajuband
      // ELBOW joint sphere (no gap)
      mesh(new THREE.SphereGeometry(0.042,12,10),SK,g,0,-0.25,0);

      // FOREARM subgroup — pivots at elbow so it can bend
      var fore=new THREE.Group(); fore.position.set(0,-0.25,0); g.add(fore);
      mesh(capsule(0.038,0.17,14),SK,fore,0,-0.11,0);          // forearm
      // wrist
      mesh(new THREE.SphereGeometry(0.034,12,10),SK,fore,0,-0.21,0);
      // bangles (choodiyan) stacked on wrist
      [0,1,2,3,4].forEach(function(b){ mesh(new THREE.TorusGeometry(0.039,0.006,6,16),(b%2?GEM:GO),fore,0,-0.18-b*0.015,0,PI/2,0,0); });
      // PALM
      mesh(new THREE.SphereGeometry(0.04,12,10),SK,fore,0,-0.26,0.005,0,0,0,1,1.05,0.6);
      // mehndi dot on palm
      mesh(new THREE.CircleGeometry(0.014,10),M(0x8a2010,0.6),fore,0,-0.27,0.03,-0.3,0,0);
      // FINGERS (4 + thumb), each slightly bent
      for(var f=0;f<4;f++){
        mesh(capsule(0.0085,0.055,6),SK,fore,(f-1.5)*0.018,-0.31,0.01,0.25,0,0);
        mesh(new THREE.SphereGeometry(0.008,6,6),SK,fore,(f-1.5)*0.018,-0.345,0.025); // fingertip nail
      }
      mesh(capsule(0.009,0.04,6),SK,fore,0.038*side*-1,-0.285,0.02,0.2,0,0.5); // thumb
      return {g:g,fore:fore};
    }
    var armL=buildArm(-1), armR=buildArm(1);

    // ════ LEGS (peek under ghagra) — jointed ════
    [-0.09,0.09].forEach(function(x){
      mesh(capsule(0.05,0.14,10),SK,null,x,0.18,0.02);          // shin
      mesh(new THREE.SphereGeometry(0.04,10,8),SK,null,x,0.07,0.02); // ankle
      mesh(capsule(0.04,0.08,8),SK,null,x,0.035,0.07,PI/2.2,0,0);    // foot
      mesh(new THREE.TorusGeometry(0.042,0.005,6,16),GO,null,x,0.055,0.02); // payal (anklet)
      // toe rings
      mesh(new THREE.TorusGeometry(0.012,0.003,5,12),GO,null,x,0.025,0.11);
    });

    // ── Floor ring ──
    var fring=mesh(new THREE.TorusGeometry(0.9,0.02,8,48),M(0x917aff,0.3,0.2,0x4030a0,0.6),null,0,0.01,0,PI/2,0,0);
    mesh(new THREE.CircleGeometry(0.85,40),FL,null,0,0,0,-PI/2,0,0);

    // ── Particles ──
    var pg=new THREE.BufferGeometry(), N=200, pos=new Float32Array(N*3);
    for(var i=0;i<N*3;i+=3){ pos[i]=(Math.random()-0.5)*6; pos[i+1]=Math.random()*4-1; pos[i+2]=(Math.random()-0.5)*6; }
    pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x917aff,size:0.02,transparent:true,opacity:0.5})));

    // ── Poses (arms hang down from shoulders; +X forward, Z inward) ──
    // armLZ: left arm tuck-in, armRZ: right arm tuck-in (mirrored), armX: raise forward
    // elb = elbow bend (forearm forward)
    var POSES={
      idle:   {armZ:0.06,armX:0.0, elb:0.25, by:0.0, bp:0,    hp:0},
      sit:    {armZ:0.10,armX:0.30,elb:0.55, by:-0.32,bp:0.04,hp:0.04},
      stand:  {armZ:0.04,armX:0.0, elb:0.15, by:0.03,bp:0,    hp:-0.04},
      clap:   {armZ:0.40,armX:0.85,elb:1.15, by:0.0, bp:0.03,hp:0.08},
      pranaam:{armZ:0.48,armX:0.75,elb:1.35, by:-0.04,bp:0.14,hp:0.2}
    };
    var pose='idle', tgt=POSES.idle, cur={armZ:0.06,armX:0,elb:0.25,by:0,bp:0,hp:0};
    window.setPose=function(p,el){
      pose=p; tgt=POSES[p];
      document.querySelectorAll('.btn').forEach(function(b){b.classList.remove('on');});
      if(el) el.classList.add('on');
    };

    // ── Orbit controls ──
    var sph={r:3.9,th:0,ph:1.3}, drag=false, px,py;
    var dom=renderer.domElement;
    dom.addEventListener('mousedown',function(e){drag=true;px=e.clientX;py=e.clientY;});
    window.addEventListener('mouseup',function(){drag=false;});
    window.addEventListener('mousemove',function(e){
      if(!drag)return; sph.th-=(e.clientX-px)*0.008; sph.ph=Math.max(0.4,Math.min(2.4,sph.ph-(e.clientY-py)*0.006)); px=e.clientX;py=e.clientY;
    });
    dom.addEventListener('wheel',function(e){ sph.r=Math.max(2,Math.min(7,sph.r+e.deltaY*0.002)); e.preventDefault(); },{passive:false});
    dom.addEventListener('touchstart',function(e){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY;});
    dom.addEventListener('touchend',function(){drag=false;});
    dom.addEventListener('touchmove',function(e){
      if(!drag)return; sph.th-=(e.touches[0].clientX-px)*0.008; sph.ph=Math.max(0.4,Math.min(2.4,sph.ph-(e.touches[0].clientY-py)*0.006)); px=e.touches[0].clientX;py=e.touches[0].clientY; e.preventDefault();
    },{passive:false});

    // ── Animate ──
    var t=0;
    function animate(){
      requestAnimationFrame(animate);
      t+=0.016;
      var k=0.09;
      for(var key in cur){ cur[key]+=(tgt[key]-cur[key])*k; }

      var clapOff=0;
      if(pose==='clap'){ clapOff=Math.abs(Math.sin(t*6))*0.16; }
      // shoulder
      armL.g.rotation.z=cur.armZ+clapOff;     // left tucks toward centre (+z)
      armR.g.rotation.z=-(cur.armZ+clapOff);  // right mirrored
      armL.g.rotation.x=cur.armX;
      armR.g.rotation.x=cur.armX;
      // elbow bend (forearm forward, toward centre on clap)
      armL.fore.rotation.x=cur.elb;
      armR.fore.rotation.x=cur.elb;

      head.position.y=1.66+cur.by+Math.sin(t*0.65)*0.01;
      head.rotation.x=cur.hp;
      root.position.y=cur.by+Math.sin(t*0.6)*0.006;
      root.rotation.y=Math.sin(t*0.28)*0.04;
      fring.material.emissiveIntensity=0.45+Math.sin(t*2)*0.25;

      var pa=pg.attributes.position.array;
      for(var i=1;i<N*3;i+=3){ pa[i]+=0.004; if(pa[i]>3) pa[i]=-1; }
      pg.attributes.position.needsUpdate=true;

      camera.position.set(
        sph.r*Math.sin(sph.ph)*Math.sin(sph.th),
        sph.r*Math.cos(sph.ph)+1.1,
        sph.r*Math.sin(sph.ph)*Math.cos(sph.th)
      );
      camera.lookAt(0,1.1,0);
      renderer.render(scene,camera);
    }
    animate();

    window.addEventListener('resize',function(){
      camera.aspect=window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth,window.innerHeight);
    });
  }

  tryLoad(0);
})();
</script>

<div id="controls">
  <button class="btn on" onclick="setPose('idle',this)">Idle</button>
  <button class="btn" onclick="setPose('sit',this)">Sit</button>
  <button class="btn" onclick="setPose('stand',this)">Stand</button>
  <button class="btn" onclick="setPose('clap',this)">Clap</button>
  <button class="btn" onclick="setPose('pranaam',this)">Pranaam</button>
</div>
</body>
</html>
